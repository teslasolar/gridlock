<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRIDLOCK — P2P Everything</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@2.5.1/webtorrent.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- JOIN SCREEN — visible by default, hidden by JS on auto-join -->
    <div id="join-screen">
      <h1>GRIDLOCK</h1>
      <p class="subtitle">P2P Everything. Zero Servers. Zero Cost.</p>
      <div class="join-form">
        <input type="text" id="input-name" placeholder="pick a name" autocomplete="off" />
        <button id="btn-join">ENTER</button>
      </div>
      <p class="hint">you'll join the global lobby. switch rooms anytime.</p>
    </div>

    <!-- MAIN UI (hidden until joined) -->
    <div id="main-ui" hidden>
      <header>
        <span id="room-label">GRIDLOCK</span>
        <span id="name-label" title="you"></span>
        <span id="peer-count">0 peers</span>
        <div id="room-switcher">
          <input type="text" id="input-room" placeholder="room name..." autocomplete="off" />
          <button id="btn-switch-room" title="Switch room">GO</button>
        </div>
        <button id="btn-leave" title="Back to global lobby">LOBBY</button>
      </header>
      <div id="layout">
        <!-- SIDEBAR -->
        <aside id="sidebar">
          <section id="peers-panel">
            <h3>PEERS</h3>
            <ul id="peers-list"></ul>
          </section>
          <section id="files-panel">
            <h3>FILES</h3>
            <ul id="files-list"></ul>
            <label class="file-share-btn">
              [share file]
              <input type="file" id="file-input" hidden />
            </label>
          </section>
          <section id="llm-panel">
            <h3>LLM</h3>
            <div id="llm-status">not loaded</div>
            <button id="btn-llm-load">Load AI</button>
            <div id="llm-input-area" hidden>
              <input type="text" id="llm-input" placeholder="ask AI..." />
              <button id="btn-llm-ask">ask</button>
            </div>
          </section>
          <section id="bridge-panel">
            <h3>CHAT BRIDGE</h3>
            <div id="bridge-status">off</div>
            <div id="bridge-config-area">
              <input type="text" id="bridge-repo" placeholder="owner/repo" value="teslasolar/gridlock" />
              <input type="text" id="bridge-issue" placeholder="issue #" value="1" />
              <input type="text" id="bridge-token" placeholder="gh token (optional)" />
              <button id="btn-bridge-connect">connect</button>
            </div>
            <button id="btn-bridge-disconnect" hidden>disconnect</button>
          </section>
          <section id="provider-panel">
            <h3>DB PROVIDER</h3>
            <div id="provider-status">none</div>
            <select id="provider-select">
              <option value="">-- select --</option>
              <option value="supabase">Supabase</option>
              <option value="firebase">Firebase</option>
              <option value="rest">REST API</option>
              <option value="websocket">WebSocket</option>
              <option value="ignition">Ignition GW</option>
              <option value="custom">Custom</option>
            </select>
            <div id="provider-config-area" hidden>
              <textarea id="provider-config" rows="4" placeholder='{"url":"...","anonKey":"..."}'></textarea>
              <button id="btn-provider-connect">connect</button>
            </div>
            <button id="btn-provider-disconnect" hidden>disconnect</button>
          </section>
        </aside>

        <!-- MAIN VIEW -->
        <main id="main-view">
          <div id="view-tabs">
            <button class="view-tab active" data-view="media">GRID</button>
            <button class="view-tab" data-view="cameras">CAMS</button>
            <button class="view-tab" data-view="screen">SCREEN</button>
          </div>

          <!-- MEDIA GRID (default view) -->
          <div id="media-view" class="view-panel active">
            <div id="media-grid"></div>
            <div id="media-bar">
              <input type="text" id="media-input" placeholder="paste URL — youtube, image, any link..." autocomplete="off" />
              <button id="btn-media-add">SHARE</button>
            </div>
          </div>

          <!-- CAMERAS -->
          <div id="cameras-view" class="view-panel">
            <div id="camera-grid"></div>
          </div>

          <!-- SCREEN SHARE -->
          <div id="screen-view" class="view-panel">
            <video id="screen-video" autoplay playsinline></video>
            <div id="screen-label"></div>
            <div id="no-screen-msg">no one is sharing their screen</div>
          </div>
        </main>

        <!-- CHAT -->
        <div id="chat-panel">
          <div id="chat-messages"></div>
          <div id="chat-input-bar">
            <input type="text" id="chat-input" placeholder="type message..." />
            <button id="btn-mic" title="Toggle mic">MIC</button>
            <button id="btn-cam" title="Toggle camera">CAM</button>
            <button id="btn-screen" title="Share screen">SCR</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Single entry point — peer.js imports all other modules -->
  <script type="module" src="modules/peer.js"></script>
</body>
</html>
